<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed ElFirgany — App Catalogue</title>
<meta name="description" content="Production mobile apps built by Ahmed ElFirgany — Senior Flutter Developer. 15+ apps, 600K+ downloads, five countries.">
<meta property="og:title" content="Ahmed ElFirgany — App Catalogue">
<meta property="og:description" content="15+ production apps across five countries. Every one with the problem it solved and a link you can open.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1720; --ink2:#39485a; --mut:#7a8898; --line:#e6e9ee;
  --bg:#ffffff; --bg2:#f6f7f9; --accent:#0b64d6; --accent2:#0a4fa8;
  --radius:18px; --maxw:1240px;
  --f-lat:'Inter',system-ui,sans-serif; --f-ar:'Cairo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-lat);
     -webkit-font-smoothing:antialiased;line-height:1.6}
html[dir=rtl] body{font-family:var(--f-ar)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

/* ---------- top bar ---------- */
.bar{position:fixed;inset-inline:0;top:0;z-index:60;background:rgba(255,255,255,.82);
     backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.25s}
.bar.on{border-bottom-color:var(--line);box-shadow:0 6px 24px rgba(15,23,32,.05)}
.bar .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em;font-size:15.5px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#0b64d6,#062f6b);
     color:#fff;display:grid;place-items:center;font-size:14px;font-family:var(--f-lat);font-weight:800}
.bar nav{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.bar nav a{font-size:13.5px;color:var(--ink2);padding:8px 12px;border-radius:9px;font-weight:500}
.bar nav a:hover{background:var(--bg2);color:var(--ink)}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;
      font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);font-family:var(--f-lat)}
.lang:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:820px){ .bar nav a{display:none} }

/* ---------- hero ---------- */
.hero{padding:150px 0 44px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
         font-weight:700;font-family:var(--f-lat);margin-bottom:20px}
html[dir=rtl] .eyebrow{letter-spacing:0;font-family:var(--f-ar)}
.hero h1{font-size:clamp(38px,6.2vw,68px);line-height:1.08;letter-spacing:-.035em;margin:0 0 22px;font-weight:800}
html[dir=rtl] .hero h1{letter-spacing:0;line-height:1.25}
.hero p.lead{font-size:clamp(16px,1.9vw,19.5px);color:var(--ink2);max-width:62ch;margin:0 0 26px}

/* ---------- profiles row (نفسه في هب الألعاب) ---------- */
.prow{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 32px}
.prow a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);
        border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--ink2);transition:.18s}
.prow a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);
              box-shadow:0 8px 20px rgba(15,23,32,.07)}
.prow a svg{width:15px;height:15px;fill:currentColor;flex:none}
.prow a .hd{color:var(--mut);font-weight:500;font-family:var(--f-lat);direction:ltr;unicode-bidi:isolate}
.prow a:hover .hd{color:var(--accent)}
@media(max-width:700px){ .prow a .hd{display:none} }
.hstats{display:flex;flex-wrap:wrap;gap:44px;padding-top:8px}
.hstats b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;font-family:var(--f-lat);
          direction:ltr;unicode-bidi:isolate;line-height:1.1}
.hstats span{font-size:12.5px;color:var(--mut);font-weight:500}

/* ---------- marquee ---------- */
.strip{margin:56px 0 0;position:relative;overflow:hidden;
       -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
       mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{display:flex;gap:18px;width:max-content;animation:slide 46s linear infinite}
.strip:hover .track,.strip:focus-within .track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
html[dir=rtl] .track{animation-name:slideR}
@keyframes slideR{from{transform:translateX(0)}to{transform:translateX(50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
.mcard{flex:0 0 340px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
       cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s,border-color .28s;
       text-align:start;display:block;font:inherit;color:inherit;overflow:hidden;
       box-shadow:0 2px 10px rgba(15,23,32,.04)}
.mcard:hover{transform:translateY(-8px);border-color:#c2d2e6;box-shadow:0 22px 52px rgba(15,23,32,.15)}
.mcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* الشباك اللي بيبين جزء من صورة التطبيق */
.mshot{position:relative;height:186px;overflow:hidden;background:linear-gradient(150deg,#eef2f7,#dde5ef)}
.mshot img{width:100%;height:auto;display:block;transform:translateY(-6%) scale(1.04);
           transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.mcard:hover .mshot img{transform:translateY(-11%) scale(1.09)}
.mshot::after{content:"";position:absolute;inset:auto 0 0 0;height:78px;
              background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.mshot.none{display:grid;place-items:center}
.mshot.none .big{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;
     background:linear-gradient(140deg,#0b64d6,#062f6b);color:#fff;font-weight:800;font-size:26px;
     font-family:var(--f-lat);box-shadow:0 12px 30px rgba(11,100,214,.3)}

.mbody{padding:0 18px 18px;position:relative;margin-top:-30px}
.mtop{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.mtop img{width:52px;height:52px;border-radius:14px;flex:none;background:#fff;object-fit:cover;
          border:2px solid #fff;box-shadow:0 6px 18px rgba(15,23,32,.14)}
.mtop .ph{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;
          background:linear-gradient(140deg,#0b64d6,#062f6b);color:#fff;font-weight:800;font-size:19px;
          font-family:var(--f-lat);border:2px solid #fff;box-shadow:0 6px 18px rgba(15,23,32,.14)}
.mtop b{font-size:16px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.25}
.mtop small{color:var(--mut);font-size:11.5px;font-family:var(--f-lat);direction:ltr;unicode-bidi:isolate}
.mcard p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.55;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.mtags span{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--mut)}
.mgo{margin-top:13px;font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.mcard:hover .mgo .arr{transform:translateY(3px)}
.mgo .arr{transition:transform .25s}
@media(max-width:640px){ .mcard{flex-basis:280px} .mshot{height:150px} }

/* ---------- app section ---------- */
.sec{padding:96px 0;border-top:1px solid var(--line)}
.sec:nth-child(even){background:var(--bg2)}
.shead{display:flex;align-items:flex-start;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.shead .ic{width:66px;height:66px;border-radius:18px;flex:none;background:#e9edf3;object-fit:cover;
           box-shadow:0 8px 22px rgba(15,23,32,.10)}
.shead .icph{width:66px;height:66px;border-radius:18px;flex:none;display:grid;place-items:center;
             background:linear-gradient(140deg,#0b64d6,#062f6b);color:#fff;font-size:24px;font-weight:800;
             font-family:var(--f-lat);box-shadow:0 8px 22px rgba(11,100,214,.28)}
.num{font-size:12.5px;font-weight:800;color:var(--accent);font-family:var(--f-lat);
     letter-spacing:.1em;margin-bottom:9px}
.sec h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;margin:0 0 6px;font-weight:800;line-height:1.14}
html[dir=rtl] .sec h2{letter-spacing:0}
.sec .one{font-size:17px;color:var(--ink2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:12px;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
/* لازم تيجي بعد قاعدة الأقسام الزوجية, وإلا الخلفية البيضا بتغلب والنص الأبيض بيختفي */
.sec .chip.role,.sec:nth-child(even) .chip.role{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;margin-top:44px;align-items:start}
@media(max-width:940px){ .grid{grid-template-columns:1fr;gap:34px} }

/* gallery */
.gal{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity;
     scrollbar-width:thin}
.gal::-webkit-scrollbar{height:7px}
.gal::-webkit-scrollbar-thumb{background:#d3dae4;border-radius:4px}
.gal img{flex:0 0 auto;height:400px;width:auto;border-radius:15px;border:1px solid var(--line);
         background:#fff;scroll-snap-align:start;box-shadow:0 10px 30px rgba(15,23,32,.07)}
@media(max-width:640px){ .gal img{height:300px} }
.noshot{border:1px dashed #cdd6e2;border-radius:15px;padding:40px 26px;text-align:center;color:var(--mut);
        font-size:13.5px;background:#fff}

.stat3{display:flex;flex-wrap:wrap;gap:34px;margin:0 0 26px}
.stat3 b{display:block;font-size:25px;font-weight:800;letter-spacing:-.02em;font-family:var(--f-lat);
         direction:ltr;unicode-bidi:isolate;line-height:1.15}
.stat3 span{font-size:12px;color:var(--mut)}
.sec .body{font-size:15.5px;color:var(--ink2);margin:0 0 26px}
h3.mini{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
        font-weight:700;margin:0 0 12px;font-family:var(--f-lat)}
html[dir=rtl] h3.mini{letter-spacing:0;font-family:var(--f-ar);text-transform:none;font-size:12.5px}
ul.did{list-style:none;padding:0;margin:0 0 26px}
ul.did li{position:relative;padding-inline-start:22px;margin-bottom:9px;font-size:14.5px;color:var(--ink2)}
ul.did li::before{content:"";position:absolute;inset-inline-start:0;top:10px;width:7px;height:7px;
                  border-radius:50%;background:var(--accent)}
.hardbox{border-inline-start:3px solid var(--accent);background:#fff;padding:16px 20px;
         border-radius:0 12px 12px 0;margin-bottom:26px}
html[dir=rtl] .hardbox{border-radius:12px 0 0 12px}
.hardbox b{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
           margin-bottom:6px;font-family:var(--f-lat)}
html[dir=rtl] .hardbox b{letter-spacing:0;text-transform:none;font-family:var(--f-ar);font-size:13px}
.hardbox p{margin:0;font-size:14.5px;color:var(--ink2)}
.tech{font-size:12.5px;color:var(--mut);font-family:var(--f-lat);direction:ltr;text-align:start;margin-bottom:24px}
.btns{display:flex;flex-wrap:wrap;gap:11px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:11px;
     font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;transition:.18s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn svg{width:16px;height:16px;flex:none}
.privnote{font-size:13px;color:var(--mut);background:#fff;border:1px dashed #cdd6e2;
          border-radius:11px;padding:13px 17px}

/* ---------- the games cross-link (نفسه في هب الألعاب) ---------- */
.cross{padding:88px 0;border-top:1px solid var(--line);background:var(--bg2)}
.crossbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:46px 44px;
          box-shadow:0 18px 44px rgba(15,23,32,.07)}
.crossbox .eyebrow{margin-bottom:14px}
.crossbox h2{font-size:clamp(25px,3.4vw,38px);letter-spacing:-.03em;margin:0 0 12px;font-weight:800;line-height:1.15}
html[dir=rtl] .crossbox h2{letter-spacing:0}
.crossbox p{color:var(--ink2);font-size:16px;margin:0 0 26px;max-width:60ch}
@media(max-width:640px){ .crossbox{padding:32px 24px} }

/* ---------- footer ---------- */
footer{padding:76px 0;border-top:1px solid var(--line);background:var(--ink);color:#fff}
footer h2{font-size:clamp(24px,3.4vw,36px);letter-spacing:-.03em;margin:0 0 14px;font-weight:800}
html[dir=rtl] footer h2{letter-spacing:0}
footer p{color:#9fb0c4;margin:0 0 28px;font-size:15.5px}
footer .btn{background:transparent;border-color:#33445a;color:#fff}
footer .btn:hover{border-color:#fff;color:#fff}
footer .btn.pri{background:#fff;border-color:#fff;color:var(--ink)}
.fine{margin-top:44px;padding-top:22px;border-top:1px solid #23303f;color:#6f8095;font-size:12.5px;
      display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.d8{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="wrap">
    <a class="brand" href="#top"><span class="dot">AE</span><span data-t="site.name"></span></a>
    <nav id="nav"></nav>
    <button class="lang" id="lang" type="button">العربية</button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="eyebrow" data-t="site.role"></div>
      <h1 data-t="site.tagline"></h1>
      <div class="prow" id="prow"></div>
      <p class="lead" data-t="site.intro"></p>
      <div class="hstats" id="hstats"></div>
    </div>
    <div class="strip"><div class="track" id="track"></div></div>
  </section>
  <div id="apps"></div>

  <section class="cross">
    <div class="wrap">
      <div class="crossbox">
        <div class="eyebrow" data-t="cross.eyebrow"></div>
        <h2 data-t="cross.h"></h2>
        <p data-t="cross.p"></p>
        <div class="btns" id="crossbtns"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <h2 data-t="cta.h"></h2>
    <p data-t="cta.p"></p>
    <div class="btns" id="cta"></div>
    <div class="fine">
      <span data-t="cta.fine"></span>
      <span><span data-t="cta.upd"></span> <span class="d8" id="built"></span></span>
    </div>
  </div>
</footer>

    facebook:'<svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.6 4.5-4.6 1.3 0 2.6.2 2.6.2v2.9h-1.5c-1.5 0-1.9.9-1.9 1.8V12h3.3l-.5 3.5h-2.8v8.4A12 12 0 0 0 24 12z"/></svg>',
    instagram:'<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4 1.3-.1 1.7-.1 4.9-.1zm0 3.6A6.2 6.2 0 1 0 18.2 12 6.2 6.2 0 0 0 12 5.8zm0 10.2A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.4-10.5a1.44 1.44 0 1 1-1.4-1.4 1.44 1.44 0 0 1 1.4 1.4z"/></svg>',
    threads:'<svg viewBox="0 0 24 24"><path d="M16.7 11.2c-.1 0-.2-.1-.3-.1-.2-3-1.8-4.7-4.5-4.7-1.6 0-3 .7-3.8 2l1.5 1c.6-.9 1.5-1.1 2.3-1.1 1.4 0 2.4.9 2.6 2.4-.7-.2-1.4-.3-2.2-.2-2.2.1-3.7 1.4-3.6 3.3.1 1.9 1.8 2.9 3.5 2.8 2.2-.1 3.4-1.6 3.6-3.5.7.4 1.2 1 1.4 1.8.4 1.3-.4 3.3-2.9 3.9-2.2.5-4.6-.1-5.9-2-.9-1.3-1.2-3-1.2-4.6 0-1.6.3-3.3 1.2-4.6C9.4 5.9 11 5.2 12.9 5.2c2 0 3.5.7 4.5 2.1.5.6.8 1.4 1 2.2l1.8-.5c-.3-1.1-.7-2.1-1.4-3-1.3-1.8-3.4-2.8-6-2.8-2.5 0-4.6 1-5.9 2.8C5.5 8 5 10 5 12s.5 4 1.7 5.6c1.3 1.9 3.4 2.9 6 2.8 2.9-.1 5.2-1.6 5.9-4.1.5-1.7-.1-3.6-1.9-5.1zm-4.4 4.4c-1 .1-1.9-.4-1.9-1.2 0-.6.5-1.2 1.9-1.3.6 0 1.2 0 1.7.1-.1 1.5-.8 2.3-1.7 2.4z"/></svg>',
    email:'<svg viewBox="0 0 24 24"><path d="M2 4h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm10 7L3 6.2V18h18V6.2L12 11z"/></svg>'
  };
  var GAMEPAD='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6H7a5 5 0 0 0-5 5v3a4 4 0 0 0 7.2 2.4l.6-.9h4.4l.6.9A4 4 0 0 0 22 14v-3a5 5 0 0 0-5-5ZM8.8 12.4H7.6v1.2a.9.9 0 1 1-1.8 0v-1.2H4.6a.9.9 0 1 1 0-1.8h1.2V9.4a.9.9 0 1 1 1.8 0v1.2h1.2a.9.9 0 1 1 0 1.8Zm6.5.6a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Zm2.6 2a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Zm0-4a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z"/></svg>';

  var BUILT = '2026-08-04';
  function txt(o){ return (o && typeof o==='object') ? (o[L]||o.en) : o; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function el(h){ var d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; }

  function render(){
    document.documentElement.lang = L;
    document.documentElement.dir  = (L==='ar') ? 'rtl' : 'ltr';
    document.getElementById('lang').textContent = (L==='ar') ? 'English' : 'العربية';
    document.title = (L==='ar' ? 'أحمد الفرجاني — كتالوج التطبيقات' : 'Ahmed ElFirgany — App Catalogue');

    document.querySelectorAll('[data-t]').forEach(function(n){
      var k=n.getAttribute('data-t');
      if(k.indexOf('site.')===0) n.textContent = txt(SITE[k.slice(5)]);
      else n.textContent = T[L][k] || k;
    });

    document.getElementById('prow').innerHTML = PROFILES.map(function(p){
      return '<a href="'+p.u+'" target="_blank" rel="noopener">'+ICON[p.k]+
             '<span>'+p.n+'</span><span class="hd">'+esc(p.h)+'</span></a>';
    }).join('');

    document.getElementById('hstats').innerHTML = SITE.stats.map(function(s){
      return '<div><b>'+esc(txt(s.v))+'</b><span>'+esc(txt(s.l))+'</span></div>'; }).join('');

    // marquee — the list twice so the loop is seamless
    var cards = APPS.map(function(a){
      var init = esc(txt(a.name).slice(0,2));
      var ic = a.icon ? '<img src="'+a.icon+'" alt="" loading="lazy" data-fb="'+init+'">'
                      : '<div class="ph">'+init+'</div>';
      // جزء من أول صورة للتطبيق. مفيش صورة؟ الأيقونة كبيرة على خلفية متدرجة.
      var shot = (a.shots && a.shots.length)
        ? '<div class="mshot"><img src="'+a.shots[0]+'" alt="" loading="lazy"></div>'
        : '<div class="mshot none"><div class="big">'+init+'</div></div>';
      var tags = txt(a.tags).slice(0,2).map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('');
      return '<button class="mcard" data-go="'+a.key+'" type="button" aria-label="'+esc(txt(a.name))+'">'+
               shot+
               '<div class="mbody">'+
                 '<div class="mtop">'+ic+'<div><b>'+esc(txt(a.name))+'</b>'+
                   '<small>'+esc(a.year)+' &middot; '+a.flag+'</small></div></div>'+
                 '<p>'+esc(txt(a.one))+'</p>'+
                 '<div class="mtags">'+tags+'</div>'+
                 '<div class="mgo">'+(L==='ar'?'شوف التفاصيل':'See the detail')+
                   '<span class="arr">↓</span></div>'+
               '</div></button>';
    });
    document.getElementById('track').innerHTML = cards.join('') + cards.join('');

    document.getElementById('nav').innerHTML =
      '<a href="#apps">'+T[L]['nav.work']+'</a>'+
      '<a href="'+SITE.links.games+'">'+T[L]['nav.games']+'</a>'+
      '<a href="'+SITE.links.github+'" target="_blank" rel="noopener">GitHub</a>';

    document.getElementById('apps').innerHTML = APPS.map(function(a,i){
      var n = String(i+1).padStart(2,'0');
      var ic = a.icon ? '<img class="ic" src="'+a.icon+'" alt="" loading="lazy" data-fb="'+esc(txt(a.name).slice(0,2))+'">'
                      : '<div class="icph">'+esc(txt(a.name).slice(0,2))+'</div>';
      var gal = a.shots && a.shots.length
        ? '<div class="gal" data-empty="'+esc(T[L]['noshot'])+'">'+a.shots.map(function(s){
            return '<img src="'+s+'" alt="'+esc(txt(a.name))+'" loading="lazy">'; }).join('')+'</div>'
        : '<div class="noshot">'+T[L]['noshot']+'</div>';
      var links = (a.links||[]).map(function(k){
        var lbl = k.label ? txt(k.label) : (T[L][k.t] || T[L]['open']);
        var ico = k.t==='play' ? PLAY : (k.t==='ios' ? IOS : GLOBE);
        return '<a class="btn pri" href="'+k.u+'" target="_blank" rel="noopener">'+ico+lbl+'</a>';
      }).join('');
      if(a.internal) links = '<div class="privnote">'+T[L]['internal']+'</div>';

      return '<section class="sec" id="'+a.key+'"><div class="wrap">'+
        '<div class="num">'+n+'</div>'+
        '<div class="shead">'+ic+'<div style="min-width:260px;flex:1">'+
          '<h2>'+esc(txt(a.name))+'</h2><p class="one">'+esc(txt(a.one))+'</p></div></div>'+
        '<div class="meta"><span class="chip role">'+esc(txt(a.role))+'</span>'+
          '<span class="chip">'+esc(a.year)+'</span>'+
          txt(a.tags).map(function(t){ return '<span class="chip">'+esc(t)+'</span>'; }).join('')+'</div>'+
        '<div class="grid"><div>'+
          '<h3 class="mini">'+T[L]['gallery']+'</h3>'+gal+
        '</div><div>'+
          '<div class="stat3">'+(a.stats||[]).map(function(s){
              return '<div><b>'+esc(txt(s.v))+'</b><span>'+esc(txt(s.l))+'</span></div>'; }).join('')+'</div>'+
          '<p class="body">'+esc(txt(a.body))+'</p>'+
          '<h3 class="mini">'+T[L]['did']+'</h3>'+
          '<ul class="did">'+txt(a.built).map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ul>'+
          '<div class="hardbox"><b>'+T[L]['hard']+'</b><p>'+esc(txt(a.hard))+'</p></div>'+
          '<div class="tech">'+a.tech.join(' &middot; ')+'</div>'+
          '<div class="btns">'+links+'</div>'+
        '</div></div></div></section>';
    }).join('');

    document.getElementById('crossbtns').innerHTML =
      '<a class="btn pri" href="'+SITE.links.games+'">'+GAMEPAD+T[L]['cross.btn']+'</a>';

    document.getElementById('cta').innerHTML =
      '<a class="btn pri" href="'+SITE.links.mail+'">'+(L==='ar'?'كلمني':'Email me')+'</a>'+
      '<a class="btn" href="'+SITE.links.linkedin+'" target="_blank" rel="noopener">LinkedIn</a>'+
      '<a class="btn" href="'+SITE.links.github+'" target="_blank" rel="noopener">GitHub</a>'+
      '<a class="btn" href="'+SITE.links.games+'">'+(L==='ar'?'الألعاب':'Games hub')+'</a>';

    document.getElementById('built').textContent = BUILT;
    wireImages();
    wireGalleries();
  }

  // معرض صور كل تطبيق بيتحرك لوحده — بس بيفضل سكرولر حقيقي, فتقدر تسحبه بإيدك.
  // ماعملتهاش بأنيميشن CSS عشان الأنيميشن بيلغي السحب, والزائر اللي عايز يبص
  // على صورة معينة لازم يقدر يمسكها.
  function autoScroll(g){
    var dir = (document.documentElement.dir === 'rtl') ? -1 : 1;
    var paused = false, raf = 0, acc = 0;
    function max(){ return g.scrollWidth - g.clientWidth; }
    function hold(ms){ paused = true; clearTimeout(g._t); g._t = setTimeout(function(){ paused=false; }, ms); }
    ['pointerenter','focusin'].forEach(function(e){ g.addEventListener(e, function(){ paused=true; clearTimeout(g._t); }); });
    ['pointerleave','focusout'].forEach(function(e){ g.addEventListener(e, function(){ hold(600); }); });
    g.addEventListener('wheel', function(){ hold(3000); }, {passive:true});
    g.addEventListener('touchstart', function(){ hold(4000); }, {passive:true});
    function step(){
      raf = requestAnimationFrame(step);
      if(paused || max() <= 4) return;
      acc += 0.55;                       // بطيء بالقصد — ده معرض مش سلايدر
      if(acc < 1) return;
      var by = Math.floor(acc); acc -= by;
      var at = Math.abs(g.scrollLeft);
      if(at >= max() - 1){ g.scrollTo({left:0, behavior:'smooth'}); hold(1200); return; }
      g.scrollLeft += dir * by;
    }
    // ما يشتغلش لو المستخدم طالب تقليل الحركة
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches) raf = requestAnimationFrame(step);
    g._stop = function(){ cancelAnimationFrame(raf); };
  }

  function wireGalleries(){
    document.querySelectorAll('.gal').forEach(function(g){
      if(g._stop) g._stop();
      // استنى الصور تحمّل الأول, وإلا scrollWidth بيبقى غلط
      var imgs=[...g.querySelectorAll('img')], left=imgs.length;
      if(!left) return;
      imgs.forEach(function(im){
        if(im.complete) done(); else { im.addEventListener('load',done,{once:true}); im.addEventListener('error',done,{once:true}); }
      });
      function done(){ if(--left<=0) autoScroll(g); }
    });
  }

  // صورة من متجر ممكن تتغير في أي وقت. لو وقعت, المفروض الصفحة تفضل شكلها
  // مظبوط — مش تسيب مربع مكسور. ده أهم من أي حاجة تانية في الصفحة دي.
  function wireImages(){
    document.querySelectorAll('.gal img, img.ic, .mtop img').forEach(function(im){
      im.addEventListener('error', function(){
        if(im.classList.contains('ic') || im.closest('.mtop')){
          var d=document.createElement('div');
          d.className = im.classList.contains('ic') ? 'icph' : 'ph';
          d.textContent = im.getAttribute('data-fb') || (im.alt||'?').slice(0,2);
          im.replaceWith(d);
        } else {
          var g=im.closest('.gal'); im.remove();
          if(g && !g.querySelector('img')){
            var n=document.createElement('div'); n.className='noshot';
            n.textContent=g.getAttribute('data-empty')||''; g.replaceWith(n);
          }
        }
      }, {once:true});
      if(im.complete && im.naturalWidth===0) im.dispatchEvent(new Event('error'));
    });
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-go]');
    if(b){ var s=document.getElementById(b.getAttribute('data-go')); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); }
  });
  document.getElementById('lang').addEventListener('click', function(){
    L = (L==='ar') ? 'en' : 'ar';
    try{ localStorage.setItem('cat-lang', L); }catch(e){}
    var u=new URL(location.href); u.searchParams.set('lang', L); history.replaceState(null,'',u);
    render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  addEventListener('scroll', function(){
    document.getElementById('bar').classList.toggle('on', scrollY>10);
  }, {passive:true});

  render();

  // لينك زي .../#adam لازم ينزل على التطبيق ده. المتصفح بيحاول قبل ما المحتوى
  // يترسم, فبنعيدها بعد الرسم — ده اللي بيخلي اللينك اللي تبعته لعميل يشتغل.
  if(location.hash.length>1){
    var el=document.getElementById(location.hash.slice(1));
    if(el) setTimeout(function(){ el.scrollIntoView({block:'start'}); }, 60);
  }
})();
</script>
